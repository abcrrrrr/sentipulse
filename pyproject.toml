[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentipulse"
version = "0.1.0"
description = "Retail sentiment time series for stocks and crypto from Reddit (X optional)"
requires-python = ">=3.10"
dependencies = [
    "praw>=7.7",
    "duckdb>=1.0",
    "pandas>=2.2",
    "typer>=0.12",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "vaderSentiment>=3.3",
    "yfinance>=0.2",
]

[project.optional-dependencies]
finbert = ["transformers>=4.40", "torch>=2.2"]
claude = ["anthropic>=0.40"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["sentipulse[finbert,claude,dashboard,dev]"]

[project.scripts]
sentipulse = "sentipulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
